syntax = "proto3";

package zigeffect.grpc.v1;
option go_package = "zigeffect-grpc-bench/gen/conformance;conformance";

message UnaryRequest {
  string id = 1;
  int64 sequence = 2;
  bytes payload = 3;
}
message UnaryResponse {
  string id = 1;
  int64 accepted_sequence = 2;
}
message ClientStreamRequest {
  int64 sequence = 1;
  bytes payload = 2;
}
message ClientStreamResponse { int64 accepted_count = 1; }
message ServerStreamRequest {
  int64 count = 1;
  bytes payload = 2;
}
message ServerStreamResponse { int64 sequence = 1; }
message BidiStreamRequest {
  int64 sequence = 1;
  bytes payload = 2;
}
message BidiStreamResponse { int64 sequence = 1; }

service ConformanceService {
  rpc Unary(UnaryRequest) returns (UnaryResponse);
  rpc ClientStream(stream ClientStreamRequest) returns (ClientStreamResponse);
  rpc ServerStream(ServerStreamRequest) returns (stream ServerStreamResponse);
  rpc BidiStream(stream BidiStreamRequest) returns (stream BidiStreamResponse);
}
