name: zigeffect causal

on:
  pull_request:
    paths:
      - ".github/workflows/zigeffect-causal.yml"
      - "packages/zigeffect/**"
      - "package.json"
      - "bun.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zigeffect-causal.yml"
      - "packages/zigeffect/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zigeffect-causal:
    name: zigeffect causal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Capture PR base causal baselines
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add ../zigeffect-causal-base "${{ github.event.pull_request.base.sha }}"

          pushd ../zigeffect-causal-base/packages/zigeffect
          zig build causal-test
          zig build causal-dev-loop -- baseline package-tests
          popd

          mkdir -p packages/zigeffect/.zig-cache/causal-artifacts
          cp ../zigeffect-causal-base/packages/zigeffect/.zig-cache/causal-artifacts/zigeffect-causal-dogfood.json \
            packages/zigeffect/.zig-cache/causal-artifacts/zigeffect-causal-ci-baseline-dogfood.json
          cp ../zigeffect-causal-base/packages/zigeffect/.zig-cache/causal-artifacts/zigeffect-causal-dev-loop-package-tests-before.json \
            packages/zigeffect/.zig-cache/causal-artifacts/zigeffect-causal-ci-baseline-package-tests.json

      - name: Print causal artifact manifest
        working-directory: packages/zigeffect
        run: zig build causal-artifacts

      - name: Run release gate
        working-directory: packages/zigeffect
        run: zig build release-gate --summary none

      - name: Write causal CI handoff
        if: ${{ failure() }}
        working-directory: packages/zigeffect
        run: zig build causal-ci-handoff

      - name: Upload causal artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: zigeffect-causal-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            packages/zigeffect/.zig-cache/causal-artifacts/*.txt
            packages/zigeffect/.zig-cache/causal-artifacts/*.json
            packages/zigeffect/.zig-cache/causal-artifacts/*.dot
            packages/zigeffect/.zig-cache/release-gate/*.txt
            packages/zigeffect/.zig-cache/release-gate/*.json

  tool-hygiene:
    name: tool hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tool hygiene check
        shell: bash
        run: |
          chmod +x packages/zigeffect/tools/check_tool_hygiene.sh
          packages/zigeffect/tools/check_tool_hygiene.sh

      - name: Guard runtime-to-tools growth ratio (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          pkg="packages/zigeffect"
          tools_added=$(git diff --numstat "$base"...HEAD -- "$pkg/tools/" \
            | awk '{ a += $1 } END { print a+0 }')
          src_changed=$(git diff --numstat "$base"...HEAD -- "$pkg/src/" \
            | awk '{ a += $1 + $2 } END { print a+0 }')
          echo "tools/ lines added: $tools_added ; src/ lines changed: $src_changed"
          # A tool must add runtime capability, not paperwork: block a PR that
          # dumps >2000 lines into tools/ while barely touching src/.
          if [ "$tools_added" -gt 2000 ] && [ "$src_changed" -lt 50 ]; then
            echo "::error::PR adds $tools_added lines to tools/ but changes only $src_changed lines in src/. See AGENTS.md > Tool Hygiene Policy."
            exit 1
          fi
