name: zigeffect grpc 24h qualification

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zigeffect-grpc-24h-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  CONNECT_CONFORMANCE_COMMIT: 5b2b709b99e2c8d4aa872fe51bb6a75f09d370e4
  SHARD_SECONDS: 17280

jobs:
  native-preflight:
    name: native preflight ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        if: matrix.arch == 'amd64'
        with:
          go-version: '1.25.x'
      - uses: oven-sh/setup-bun@v2
        if: matrix.arch == 'amd64'
        with:
          bun-version: latest
      - name: Install native and interoperability dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev libssl-dev python3-venv
          python3 -m venv /tmp/zigeffect-grpc-venv
          /tmp/zigeffect-grpc-venv/bin/pip install --disable-pip-version-check \
            grpcio==1.82.1 protobuf==6.33.5 absl-py==2.3.1 \
            google-auth==2.40.3 cryptography==45.0.7 requests==2.32.5
          if [ "${{ matrix.arch }}" = amd64 ]; then
            go install "connectrpc.com/conformance/cmd/connectconformance@${CONNECT_CONFORMANCE_COMMIT}"
            go install google.golang.org/grpc/interop/client@v1.81.1
            mv "$HOME/go/bin/client" "$HOME/go/bin/grpc-go-interop-client"
            go install google.golang.org/grpc/interop/server@v1.81.1
            mv "$HOME/go/bin/server" "$HOME/go/bin/grpc-go-interop-server"
          fi
      - name: Native package tests (ReleaseSafe and ReleaseFast)
        working-directory: packages/zigeffect-grpc
        run: |
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build test -Doptimize=ReleaseFast --summary all
      - name: Verify candidate receipt source binding
        working-directory: packages/zigeffect-grpc
        run: test "$(python3 tests/source_digest.py ../..)" = "$(jq -r .source.normalized_sha256 conformance/grpc-live.v2.candidate.json)"
      - name: Official gRPC interoperability (both roles, plaintext and TLS)
        working-directory: packages/zigeffect-grpc
        run: zig build official-interop-test -Doptimize=ReleaseSafe -Dpython=/tmp/zigeffect-grpc-venv/bin/python --summary all
      - name: Stable Connect, grpc-go differential, and Connect-ES gates
        if: matrix.arch == 'amd64'
        working-directory: packages/zigeffect-grpc
        run: |
          zig build connect-conformance-test -Doptimize=ReleaseSafe -Dconnect-conformance-runner="$HOME/go/bin/connectconformance" --summary all
          zig build grpc-go-interop-test -Doptimize=ReleaseSafe -Dgrpc-go-client="$HOME/go/bin/grpc-go-interop-client" -Dgrpc-go-server="$HOME/go/bin/grpc-go-interop-server" --summary all
          zig build connect-test -Doptimize=ReleaseSafe --summary all
      - name: Generated Solid client gate
        if: matrix.arch == 'amd64'
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/zigeffect-grpc-web typecheck
          bun run --cwd packages/zigeffect-grpc-web test
      - name: Defensive malformed-frame and certificate-rotation campaign
        if: matrix.arch == 'amd64'
        env:
          GRPC_ADVERSARIAL_ITERATIONS: 1000
        run: |
          packages/zigeffect-grpc/tests/run_adversarial_campaign.sh
          cp packages/zigeffect-grpc/.zigeffect/tests/suites/zigeffect-grpc-adversarial-tests.json /tmp/zigeffect-grpc-adversarial-amd64.json
      - name: Cloud Run container smoke
        env:
          TARGETARCH: ${{ matrix.arch }}
        run: packages/zigeffect-grpc/tests/run_cloud_run_container.sh /tmp/zigeffect-grpc-venv/bin/python
      - name: Write native preflight receipt
        env:
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          arch = os.environ["ARCH"]
          checks = [
              "native-release-safe-79-tests",
              "native-release-fast-79-tests",
              "official-grpc-both-roles-plaintext-and-tls",
              "cloud-run-container-smoke",
          ]
          if arch == "amd64":
              checks.extend([
                  "official-connect-120-cases",
                  "grpc-go-both-roles-plaintext-and-tls",
                  "connect-es",
                  "generated-solid-client",
                  "malformed-frame-and-certificate-rotation-1000",
              ])
          receipt = {
              "schema": "zigeffect.grpc-native-preflight",
              "version": 1,
              "status": "passed",
              "complete": True,
              "commit": os.environ["COMMIT_SHA"],
              "run_id": os.environ["RUN_ID"],
              "architecture": arch,
              "checks": [{"id": check, "status": "passed"} for check in checks],
          }
          with open(f"/tmp/zigeffect-grpc-native-{arch}.json", "w", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: zigeffect-grpc-native-${{ github.run_id }}-${{ matrix.arch }}
          retention-days: 365
          path: |
            /tmp/zigeffect-grpc-native-${{ matrix.arch }}.json
            /tmp/zigeffect-grpc-adversarial-amd64.json

  soak-shards:
    name: soak shard ${{ matrix.shard }} of 5
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install gRPC load driver
        run: |
          python3 -m venv /tmp/zigeffect-grpc-venv
          /tmp/zigeffect-grpc-venv/bin/pip install --disable-pip-version-check grpcio==1.82.1
      - name: Run mixed-shape bounded-memory segment
        env:
          GRPC_LOAD_CALLS: 100000
          GRPC_LOAD_WORKERS: 64
          GRPC_SOAK_SECONDS: ${{ env.SHARD_SECONDS }}
          GRPC_MAX_MEMORY_GROWTH_BYTES: 67108864
          GRPC_LOAD_RECEIPT: /tmp/zigeffect-grpc-soak-${{ matrix.shard }}.json
        run: packages/zigeffect-grpc/tests/run_cloud_run_container.sh /tmp/zigeffect-grpc-venv/bin/python
      - name: Bind segment to source revision
        env:
          SHARD: ${{ matrix.shard }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = f"/tmp/zigeffect-grpc-soak-{os.environ['SHARD']}.json"
          receipt = json.load(open(path, encoding="utf-8"))
          receipt["commit"] = os.environ["COMMIT_SHA"]
          receipt["run_id"] = os.environ["RUN_ID"]
          receipt["shard"] = int(os.environ["SHARD"])
          with open(path, "w", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: zigeffect-grpc-24h-${{ github.run_id }}-${{ matrix.shard }}
          retention-days: 180
          path: /tmp/zigeffect-grpc-soak-${{ matrix.shard }}.json

  qualify:
    name: qualify 24-hour mixed-shape campaign
    needs: [native-preflight, soak-shards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zigeffect-grpc-native-${{ github.run_id }}-*
          path: /tmp/zigeffect-grpc-native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: zigeffect-grpc-24h-${{ github.run_id }}-*
          path: /tmp/zigeffect-grpc-24h
          merge-multiple: true
      - name: Merge and verify all five sequential segments
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          native_paths = sorted(glob.glob("/tmp/zigeffect-grpc-native/zigeffect-grpc-native-*.json"))
          native = [json.load(open(path, encoding="utf-8")) for path in native_paths]
          if sorted(item.get("architecture") for item in native) != ["amd64", "arm64"]:
              raise SystemExit("native amd64 and arm64 preflight receipts are required")
          if any(item.get("commit") != os.environ["COMMIT_SHA"] for item in native):
              raise SystemExit("native preflight must exercise the soak source revision")
          if any(item.get("status") != "passed" or not item.get("complete") for item in native):
              raise SystemExit("a native preflight receipt is incomplete")
          adversarial_path = "/tmp/zigeffect-grpc-native/zigeffect-grpc-adversarial-amd64.json"
          adversarial = json.load(open(adversarial_path, encoding="utf-8"))
          counts = adversarial.get("counts", {})
          if (
              adversarial.get("status") != "passed"
              or not adversarial.get("complete")
              or counts.get("discovered") != counts.get("executed")
              or counts.get("failed") != 0
              or counts.get("pending") != 0
              or counts.get("leaks") != 0
              or counts.get("log_errors") != 0
              or "GRPC_ADVERSARIAL_ITERATIONS=1000" not in adversarial.get("execution", {}).get("replay_command", "")
          ):
              raise SystemExit("the defensive campaign receipt is incomplete")
          paths = sorted(glob.glob("/tmp/zigeffect-grpc-24h/zigeffect-grpc-soak-*.json"))
          segments = [json.load(open(path, encoding="utf-8")) for path in paths]
          if len(segments) != 5 or sorted(item.get("shard") for item in segments) != [1, 2, 3, 4, 5]:
              raise SystemExit("all five soak segments are required")
          if any(item.get("commit") != os.environ["COMMIT_SHA"] for item in segments):
              raise SystemExit("every segment must exercise the same source revision")
          if any(item.get("failures") != 0 for item in segments):
              raise SystemExit("a soak segment reported an RPC failure")
          if any(not item.get("memory", {}).get("qualified", False) for item in segments):
              raise SystemExit("a soak segment exceeded its memory-growth bound")
          required = {"unary", "client_streaming", "server_streaming", "bidirectional_streaming"}
          if any(set(item.get("completed_by_shape", {})) != required for item in segments):
              raise SystemExit("every segment must exercise all four RPC shapes")
          total_seconds = sum(item.get("elapsed_seconds", 0) for item in segments)
          if total_seconds < 86400:
              raise SystemExit("the aggregate campaign did not run for 24 hours")
          receipt = {
              "schema": "zigeffect.grpc-24h-qualification",
              "version": 2,
              "status": "passed",
              "complete": True,
              "commit": os.environ["COMMIT_SHA"],
              "run_id": os.environ["RUN_ID"],
              "elapsed_seconds": total_seconds,
              "process_churn_segments": 5,
              "native": native,
              "adversarial": adversarial,
              "segments": segments,
              "blocking_checks": ["deployed-gcp-cloud-run-service-to-service-receipt"],
          }
          with open("/tmp/zigeffect-grpc-24h-campaign.json", "w", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True)
              output.write("\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: zigeffect-grpc-24h-qualified-${{ github.run_id }}
          retention-days: 365
          path: /tmp/zigeffect-grpc-24h-campaign.json
