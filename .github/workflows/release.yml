name: release packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package without a leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Test package release boundary
        run: |
          scripts/test_package_release.sh
          scripts/test_install.sh
      - name: Build release packages
        run: scripts/package_release.sh "$VERSION" dist/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ZigEffect $TAG" --generate-notes
          gh release upload "$TAG" dist/release/* --clobber
      - name: Verify public install and standalone scaffold
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/zigeffect-install"
          project_root="$RUNNER_TEMP/zigeffect-consumer"
          ZIGEFFECT_VERSION="$VERSION" ZIGEFFECT_INSTALL_DIR="$install_root" sh install.sh
          cd "$RUNNER_TEMP"
          "$install_root/bin/zigeffect" create zigeffect-consumer
          test "$("$install_root/bin/zigeffect" --version)" = "zigeffect $VERSION"
          cd "$project_root"
          zig build test
